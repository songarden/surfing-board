services:
  app:
    build: .
    container_name: surfboard
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
    ports:
      # 집/사내망에서만 열려면 "127.0.0.1:8888:8888" 으로 바꾸고 프록시나 Tailscale 을 앞에 두세요.
      - "8888:8888"
    volumes:
      - ./data:/app/data

